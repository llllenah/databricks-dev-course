bundle:
  name: lab12_rag

include:
  - resources/*.yml

variables:
  catalog:
    default: workspace
  uc_readers:
    description: Principal that can read the chunks and the index
    default: account users
  vs_endpoint_type:
    default: STANDARD
  embedding_endpoint:
    default: databricks-gte-large-en
  llm_endpoint:
    default: databricks-meta-llama-3-3-70b-instruct
  judge_endpoint:
    default: databricks-llama-4-maverick
  docs_repo:
    default: delta-io/delta
  docs_commit:
    default: 719768686369f1d52e6891aec1f7fa1be903975c
  docs_prefix:
    default: docs/src/content/docs/
  warehouse_id:
    lookup:
      warehouse: Serverless Starter Warehouse

permissions:
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}
  - level: CAN_VIEW
    group_name: users

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-8e12e7c0-b723.cloud.databricks.com

  # Deployed only by CI.
  prod:
    mode: production
    presets:
      name_prefix: "[lena066636] "
    workspace:
      host: https://dbc-8e12e7c0-b723.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
