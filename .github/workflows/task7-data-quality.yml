name: task7 data quality

on:
  push:
    branches: [main]
    paths:
      - "task7_data_quality/**"
      - ".github/workflows/task7-data-quality.yml"
  pull_request:
    paths:
      - "task7_data_quality/**"
      - ".github/workflows/task7-data-quality.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: task7_data_quality

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[local]"
      - run: pytest --junitxml=pytest-report.xml
        env:
          SPARK_MODE: local
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-report
          path: task7_data_quality/pytest-report.xml

  dq-gate:
    needs: unit-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Check credentials
        working-directory: .
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "DATABRICKS_HOST or DATABRICKS_TOKEN secret is not set" && exit 1
          fi
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev
      - run: databricks bundle deploy -t dev
      - name: Run pipeline and data quality suite
        run: databricks bundle run -t dev lab7_orders_dq
