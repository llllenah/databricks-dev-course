resources:
  pipelines:
    orders_pipeline:
      name: orders-bronze-silver
      catalog: ${var.catalog}
      schema: ${resources.schemas.silver.name}
      serverless: true
      libraries:
        - file:
            path: ../pipelines/orders_pipeline.py
      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${resources.schemas.bronze.name}
        silver_schema: ${resources.schemas.silver.name}
        landing_path: /Volumes/${var.catalog}/${resources.schemas.bronze.name}/${resources.volumes.landing.name}/orders/
        src_path: ${workspace.file_path}/src
