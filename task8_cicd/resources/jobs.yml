resources:
  jobs:
    # Data loading: write the landing files, then bronze and silver with the declarative pipeline.
    orders_ingest:
      name: orders-ingest
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${resources.schemas.bronze.name}
        - name: landing_volume
          default: ${resources.volumes.landing.name}
        - name: src_path
          default: ${workspace.file_path}/src
      tasks:
        - task_key: generate_landing_data
          notebook_task:
            notebook_path: ../notebooks/00_generate_landing_data.py

        - task_key: orders_pipeline
          depends_on:
            - task_key: generate_landing_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.orders_pipeline.id}
            full_refresh: true

    # Gold layer and data quality on top of silver.
    orders_gold_dq:
      name: orders-gold-dq
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${resources.schemas.bronze.name}
        - name: silver_schema
          default: ${resources.schemas.silver.name}
        - name: gold_schema
          default: ${resources.schemas.gold.name}
        - name: src_path
          default: ${workspace.file_path}/src
        - name: checks_path
          default: ${workspace.file_path}/checks
      tasks:
        - task_key: gold_ddl
          notebook_task:
            notebook_path: ../notebooks/01_gold_ddl.py

        - task_key: static_dimensions
          depends_on:
            - task_key: gold_ddl
          notebook_task:
            notebook_path: ../notebooks/02_static_dimensions.py

        - task_key: build_gold
          depends_on:
            - task_key: static_dimensions
          notebook_task:
            notebook_path: ../notebooks/03_build_gold.py

        - task_key: delta_constraints
          depends_on:
            - task_key: build_gold
          notebook_task:
            notebook_path: ../notebooks/04_delta_constraints.py

        - task_key: dqx_checks
          depends_on:
            - task_key: build_gold
          notebook_task:
            notebook_path: ../notebooks/05_dqx_checks.py

        - task_key: dq_suite
          depends_on:
            - task_key: delta_constraints
            - task_key: dqx_checks
          notebook_task:
            notebook_path: ../notebooks/06_dq_suite.py

    # Daily orchestration: loading first, then gold and data quality. CI runs this job after deploy.
    orders_daily:
      name: orders-daily
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.notification_email}
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/Kyiv
        pause_status: ${var.schedule_pause_status}
      tasks:
        - task_key: ingest
          run_job_task:
            job_id: ${resources.jobs.orders_ingest.id}

        - task_key: gold_dq
          depends_on:
            - task_key: ingest
          run_job_task:
            job_id: ${resources.jobs.orders_gold_dq.id}
