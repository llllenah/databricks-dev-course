bundle:
  name: lab8_orders_cicd

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all layers
  uc_readers:
    description: Principal that gets read access to the schemas and the landing volume
    default: account users
  viewer_group:
    description: Workspace group that can view the jobs, the pipeline, the dashboard and the alert
    default: users
  notification_email:
    description: Address for job failure and alert notifications
    default: ${workspace.current_user.userName}
  warehouse_id:
    description: SQL warehouse for the dashboard and the alert
  schedule_pause_status:
    description: State of the daily schedule of the orchestration job
    default: PAUSED

permissions:
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}
  - level: CAN_VIEW
    group_name: ${var.viewer_group}

targets:
  # Course workspace; development mode isolates resources per user (dev_<user>_ prefix).
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405604651938730.10.azuredatabricks.net
    variables:
      catalog: dbr_dev_ua5816bd
      warehouse_id:
        lookup:
          warehouse: Serverless Starter Warehouse

  # Deployed only by CI. The workspace is shared, so resources carry the user prefix.
  prod:
    mode: production
    presets:
      name_prefix: "[lena066636] "
    workspace:
      host: https://adb-7405613488297663.3.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbr_dev_ua_5816_trail_3
      warehouse_id:
        lookup:
          warehouse: Serverless Starter Warehouse
    resources:
      schemas:
        bronze:
          lifecycle:
            prevent_destroy: true
        silver:
          lifecycle:
            prevent_destroy: true
        gold:
          lifecycle:
            prevent_destroy: true
